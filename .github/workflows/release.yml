# Builds the platform wheels that make `pip install tubulin` work without a Rust
# toolchain or node. Each wheel carries the compiled `tubulin` binary, the Python
# package, and the built frontend (see `[tool.maturin]` in pyproject.toml).
#
# Publishing is manual on purpose: the workflow uploads wheels as artifacts, and the
# `publish` job runs only for a tagged release with the PyPI environment configured.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      # The frontend ships inside the wheel, so it must be built first and staged
      # where `[tool.maturin] include` expects it — same steps as `make wheel`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cp -R frontend/dist python/tubulin/_frontend

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --target ${{ matrix.target }}
          manylinux: auto

      # Prove the wheel actually runs before it can ever be published. Shared with CI
      # (`make smoke-wheel`) so the release gate and the PR gate can't drift apart.
      - name: smoke test the wheel
        shell: bash
        run: ./scripts/smoke-dist.sh "$(ls dist/*.whl | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The sdist carries the built frontend as well, because a source build has no
      # node: without this, `pip install` from the sdist would compile a runtime that
      # serves 404 for every page. Same staging as the wheel job (`make stage-frontend`).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cp -R frontend/dist python/tubulin/_frontend

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: the sdist must carry the frontend
        run: tar tzf dist/*.tar.gz | grep -q '_frontend/index.html'

      # CI only checks the sdist structurally, because building it recompiles the
      # runtime from scratch. Before publishing, actually build and run it.
      - name: smoke test the sdist
        run: ./scripts/smoke-dist.sh "$(ls dist/*.tar.gz | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
