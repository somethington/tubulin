# Roadmap #12: the repo had real coverage across three languages and nothing ran it.
# Each job mirrors a `make` target so the same commands work locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the polars-written parquet compatibility test, which reads the
      # committed fixture under tests/fixtures/.
      - run: cargo test --all

  python:
    name: python (pytest + tpp integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group examples
      - run: uv run ruff check --select E9,F python tests examples
      # tests/ is the framework suite; test_tpp.py runs a real app end-to-end through
      # the headless harness (same execution core as a worker).
      - run: PYTHONPATH=python uv run pytest tests/ examples/tpp/test_tpp.py -q

  frontend:
    name: frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
